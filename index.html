<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SACRO</title>
<meta name="description" content="Sacro — música y mundo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --marfil:#F6F2EA;
  --tinta:#15130F;
  --bronce:#A5854D;
  --piedra:#8E8779;
  --hair:rgba(21,19,15,.14);
  --hair-luz:rgba(246,242,234,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--marfil);
  color:var(--tinta);
  font-family:'Jost',sans-serif;
  font-weight:300;
  line-height:1.8;
  letter-spacing:.02em;
  overflow-x:hidden;
}
.wrap{max-width:640px;margin:0 auto;padding:0 28px}
/* idioma */
.lang{position:fixed;top:20px;right:22px;z-index:60;display:flex;gap:2px}
.lang button{
  background:none;border:none;color:var(--piedra);cursor:pointer;
  font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.22em;
  padding:6px 8px;transition:color .3s;
}
.lang button.active{color:var(--bronce)}
.lang button:focus-visible{outline:1px solid var(--bronce);outline-offset:2px}

/* ===== HERO ===== */
.hero{
  min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:0 24px;
}
.bird{width:22px;height:22px;margin-bottom:46px;opacity:.9}
.bird svg{width:100%;height:100%;fill:var(--bronce)}
h1{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:clamp(58px,13vw,110px);
  letter-spacing:.4em;margin-right:-.4em;
  line-height:1;
}
.hero .rule{
  width:38px;height:1px;background:var(--bronce);
  margin-top:46px;opacity:.8;
}
/* ===== secciones ===== */
section{padding:120px 0}
.eyebrow{
  color:var(--bronce);font-size:11px;letter-spacing:.4em;
  text-transform:uppercase;margin-bottom:52px;font-weight:400;
}
/* manifiesto */
.manifesto p{
  font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:clamp(24px,3.8vw,31px);line-height:1.65;
}
.manifesto p + p{margin-top:1.1em}
.manifesto em{font-style:italic;font-weight:300}
/* música */
.rel{
  display:flex;align-items:baseline;gap:20px;
  padding:26px 0;border-bottom:1px solid var(--hair);
  text-decoration:none;color:var(--tinta);
  transition:opacity .3s;
}
.rel:first-of-type{border-top:1px solid var(--hair)}
.rel:hover .tt{color:var(--bronce)}
.rel .yr{
  font-size:11px;color:var(--piedra);letter-spacing:.18em;min-width:48px;
}
.rel .tt{
  font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:clamp(21px,3.4vw,26px);flex:1;transition:color .3s;
}
.rel .kind{
  font-size:10px;color:var(--piedra);letter-spacing:.26em;
  text-transform:uppercase;white-space:nowrap;
}
/* ===== tease — banda de tinta ===== */
.tease{
  background:var(--tinta);color:var(--marfil);
  text-align:center;padding:150px 24px;
  margin:60px calc(50% - 50vw) 0;
}
.tease .mono{
  color:var(--bronce);font-size:11px;letter-spacing:.4em;
  text-transform:uppercase;margin-bottom:34px;font-weight:400;
}
.tease h2{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:clamp(38px,8vw,64px);letter-spacing:.22em;margin-right:-.22em;
  line-height:1.15;
}
.tease p{
  margin-top:26px;font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(17px,2.8vw,20px);color:rgba(246,242,234,.75);
}
.tease .rule{
  width:38px;height:1px;background:var(--bronce);
  margin:0 auto 40px;opacity:.8;
}
/* escucha */
.links{display:flex;flex-direction:column}
.links a{
  display:flex;justify-content:space-between;align-items:center;
  color:var(--tinta);text-decoration:none;
  font-size:12px;letter-spacing:.32em;text-transform:uppercase;
  padding:22px 0;border-bottom:1px solid var(--hair);
  transition:color .3s;
}
.links a:first-child{border-top:1px solid var(--hair)}
.links a span.arrow{color:var(--bronce);font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:0}
.links a:hover{color:var(--bronce)}
.links a:focus-visible{outline:1px solid var(--bronce);outline-offset:3px}
footer{
  padding:90px 0 50px;color:var(--piedra);
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  text-align:center;
}
/* reveal */
.reveal{opacity:0;transform:translateY(16px);transition:opacity 1.2s ease,transform 1.2s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<nav class="lang" aria-label="Idioma">
  <button id="btn-es" class="active" onclick="setLang('es')">ES</button>
  <button id="btn-en" onclick="setLang('en')">EN</button>
</nav>

<header class="hero">
  <div class="bird" aria-hidden="true">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 30c-6-9-18-13-30-11 9 3 15 7 19 13-4-1-8 0-11 2 5 0 9 2 12 5 2 2 4 6 5 10l3-8c2 2 3 5 3 9 2-4 2-8 1-11 4-4 9-6 15-6-4-2-8-2-12-1 5-6 12-10 21-12-12-2-22 2-26 10z"/>
    </svg>
  </div>
  <h1>SACRO</h1>
  <div class="rule" aria-hidden="true"></div>
</header>

<main>

  <div class="wrap">
    <section class="manifesto reveal" style="text-align:center">
      <p><em data-es="Que la música hable." data-en="Let the music speak.">Que la música hable.</em></p>
    </section>

    <section class="reveal" id="musica">
      <p class="eyebrow" data-es="Música" data-en="Music">Música</p>
      <a class="rel" href="https://open.spotify.com/album/5MYhjuZQXcnhy6bGirXPv4" target="_blank" rel="noopener">
        <span class="yr">2024</span>
        <span class="tt">La Luz al Final del Túnel</span>
        <span class="kind">EP</span>
      </a>
      <a class="rel" href="https://open.spotify.com/album/1MsVSJ2ZDr5pJPvaYMrdL1" target="_blank" rel="noopener">
        <span class="yr">2024</span>
        <span class="tt">Desbalance</span>
        <span class="kind" data-es="Sencillo" data-en="Single">Sencillo</span>
      </a>
      <a class="rel" href="https://open.spotify.com/track/6gN2MorjH6rJcZfu3hsGPo" target="_blank" rel="noopener">
        <span class="yr">2024</span>
        <span class="tt">Me Pesa</span>
        <span class="kind" data-es="Sencillo" data-en="Single">Sencillo</span>
      </a>
    </section>
  </div>

  <section class="tease reveal">
    <div class="rule" aria-hidden="true"></div>
    <h2 data-es="OCTUBRE 2026" data-en="OCTOBER 2026">OCTUBRE 2026</h2>
    <p data-es="La historia continúa." data-en="The story continues.">La historia continúa.</p>
  </section>

  <div class="wrap">
    <section class="reveal">
      <p class="eyebrow" data-es="Escucha" data-en="Listen">Escucha</p>
      <div class="links">
        <a href="https://open.spotify.com/artist/3gy7JBS79nEvQ2jDORrBCx" target="_blank" rel="noopener">Spotify <span class="arrow">→</span></a>
        <a href="https://music.apple.com/us/artist/sacro/1701623595" target="_blank" rel="noopener">Apple Music <span class="arrow">→</span></a>
        <a href="https://youtube.com/@laesquinadesacro" target="_blank" rel="noopener">YouTube <span class="arrow">→</span></a>
        <a href="https://www.instagram.com/sacropr" target="_blank" rel="noopener">Instagram <span class="arrow">→</span></a>
      </div>
    </section>

    <section class="reveal">
      <p class="eyebrow" data-es="Contacto" data-en="Contact">Contacto</p>
      <div class="links">
        <a href="mailto:Marcosjeliel25@gmail.com">Marcosjeliel25@gmail.com <span class="arrow">→</span></a>
        <a href="tel:+17873665330">+1 787 366 5330 <span class="arrow">→</span></a>
      </div>
    </section>

    <footer>
      <span>© MMXXVI Sacro Media</span>
    </footer>
  </div>

</main>

<script>
function setLang(l){
  document.documentElement.lang = l;
  document.getElementById('btn-es').classList.toggle('active', l==='es');
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.querySelectorAll('[data-es]').forEach(el=>{ el.textContent = el.dataset[l]; });
}
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
},{threshold:.15});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
